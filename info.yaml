# SKY26d FP32 FPU hardening trial: four tiles.
project:
  title: "FP32 Arithmetic Unit"
  author: "Calin"
  discord: ""
  description: "Multi-cycle FP32 add, subtract, multiply, divide and fixed-point conversions with byte-handshaked I/O"
  language: "SystemVerilog"
  clock_hz: 18000000
  tiles: "2x2"
  top_module: "tt_um_calincalin644_fpu_fp32"
  source_files:
    - "flpoint_iterative.sv"
    - "tt_um_calincalin644_fpu_fp32.v"

pinout:
  ui[0]: "Write data bit 0"
  ui[1]: "Write data bit 1"
  ui[2]: "Write data bit 2"
  ui[3]: "Write data bit 3"
  ui[4]: "Write data bit 4"
  ui[5]: "Write data bit 5"
  ui[6]: "Write data bit 6"
  ui[7]: "Write data bit 7"
  uo[0]: "Read data bit 0"
  uo[1]: "Read data bit 1"
  uo[2]: "Read data bit 2"
  uo[3]: "Read data bit 3"
  uo[4]: "Read data bit 4"
  uo[5]: "Read data bit 5"
  uo[6]: "Read data bit 6"
  uo[7]: "Read data bit 7"
  uio[0]: "Request toggle (input)"
  uio[1]: "Read=1 / write=0 (input)"
  uio[2]: "Register address bit 0 (input)"
  uio[3]: "Register address bit 1 (input)"
  uio[4]: "Register address bit 2 (input)"
  uio[5]: "Register address bit 3 (input)"
  uio[6]: "Acknowledge toggle (output)"
  uio[7]: "Busy (output)"

yaml_version: 6
